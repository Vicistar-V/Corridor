[package]
name = "agent-registry"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
corridor-common = { path = "../common" }
soroban-sdk = "20.5.0"

[features]
default = []
testutils = ["soroban-sdk/testutils"]

[dev-dependencies]
soroban-sdk = { version = "20.5.0", features = ["testutils"] }

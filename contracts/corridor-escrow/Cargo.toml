[package]
name = "corridor-escrow"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
agent-registry = { path = "../agent-registry" }
corridor-common = { path = "../common" }
rate-oracle-adapter = { path = "../rate-oracle-adapter" }
soroban-sdk = "20.5.0"

[dev-dependencies]
soroban-sdk = { version = "20.5.0", features = ["testutils"] }
agent-registry = { path = "../agent-registry", features = ["testutils"] }
rate-oracle-adapter = { path = "../rate-oracle-adapter", features = ["testutils"] }

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch/PR so CI fails fast and keeps
# resources free.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Toolchain + wasm32v1-none target come from the repo's
      # rust-toolchain.toml (pinned 1.96.0 — newest rustc that builds
      # Soroban 20.x's pinned ethnum 1.5.0).
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build contracts (wasm32v1-none)
        run: cargo build --workspace --target wasm32v1-none --release

      - name: Test contracts
        run: cargo test --workspace

  frontends:
    name: "${{ matrix.app }} (build + lint)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        app: [sender-app, agent-dashboard]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build